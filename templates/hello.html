<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello - Supabase & Go</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f3f4f6; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; max-width: 440px; text-align: center; }
        .badge { display: inline-block; background-color: #d1fae5; color: #065f46; font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 9999px; margin-bottom: 1rem; text-transform: uppercase; }
        h1 { color: #111827; margin: 0 0 0.5rem 0; font-size: 1.75rem; }
        p { color: #4b5563; font-size: 0.95rem; line-height: 1.5; margin: 0.5rem 0; }
        .user-box { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin: 1.5rem 0; text-align: left; }
        .user-box div { margin-bottom: 0.5rem; font-size: 0.875rem; }
        .user-box div:last-child { margin-bottom: 0; }
        .label { color: #6b7280; font-weight: 500; }
        .value { color: #111827; font-weight: 600; font-family: monospace; }
        .logout-btn { display: inline-block; width: 100%; padding: 0.75rem; background-color: #ef4444; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.95rem; transition: background-color 0.2s; box-sizing: border-box; }
        .logout-btn:hover { background-color: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Authenticated</span>
        <h1>Hello! 🎉</h1>
        <p>Self-Hosted Supabaseでの認証に成功しました。</p>
        
        <div class="user-box">
            <div><span class="label">Email:</span> <span class="value" style="font-family: inherit;">{{ .Email }}</span></div>
            <div><span class="label">User ID:</span> <span class="value">{{ .UserID }}</span></div>
        </div>

        <a href="/logout" class="logout-btn">ログアウト</a>
    </div>
</body>
</html>
